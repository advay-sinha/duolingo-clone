# Alembic configuration.
#
# Deliberately minimal. Almost everything Alembic can be configured with here is
# left out, because it is either irrelevant to this project or — in the case of
# the database URL — already configured somewhere better.
#
# **There is no `sqlalchemy.url` in this file, and that is the important part.**
# The URL comes from `app.core.config.get_settings().database_url`, which is the
# single source of truth the whole application already uses. Putting a second
# copy here would mean `alembic upgrade head` could migrate a *different*
# database than the one the app opens — the kind of mistake that is invisible
# until a production migration silently does nothing. See `alembic/env.py`.

[alembic]
# Relative to this file, so `alembic` works from backend/ regardless of how the
# shell got there.
script_location = alembic

# Let `alembic revision` find `app.*` without the project being pip-installed.
# Same reason pytest.ini sets pythonpath.
prepend_sys_path = .

# Split `prepend_sys_path` with os.pathsep. Alembic warns without this, because
# its legacy behaviour also splits on commas, spaces AND colons -- which quietly
# mangles a Windows path like `C:\project`.
path_separator = os

# Migration filenames are prefixed with a number so `ls` shows them in order.
# The revision id itself is still what Alembic tracks; this is for humans.
file_template = %%(rev)s_%%(slug)s

# `timezone = UTC` is deliberately NOT set. It would make the Create Date comment
# in each migration UTC rather than local, which is marginally nicer — and on
# Windows it requires the `tzdata` package, because CPython has no bundled
# timezone database there. A dependency for a comment is a bad trade. The
# revision graph is ordered by `down_revision`, not by these timestamps, so
# nothing depends on them.


# --- logging --------------------------------------------------------------
# Alembic prints through Python's logging, which is off by default. These
# sections turn on just enough to see what a migration actually did — which is
# the whole point of running one.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
# Set to INFO to see every statement a migration emits. Useful when reviewing a
# migration against a real database; noisy otherwise.
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
